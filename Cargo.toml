[package]
name = "gcs"
version = "0.1.0"
edition = "2024"

[dependencies]
mavlink = { version = "0.21.0", default-features = false, features = ["std", "tokio", "transport-udp", "dialect-common"] }
rumqttc = "0.25.1"
serde = {version = "1.0", features = ["derive"] } 
tokio = { version = "1", features = ["full"] }
serde_json = "1.0" 
[profile.dev]
debug = 0

